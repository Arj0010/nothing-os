-- repos.conf — REPOS :// SYNC widget for the Nothing OS desktop.
--
-- Renders ~/.cache/repo-sync/panel.txt, which is written by ~/projects/sync-repos.sh
-- on a systemd timer. This instance does no git work and never touches the network,
-- so it can never block the desktop.
--
-- To move it: change gap_x / gap_y below.

conky.config = {
    alignment = 'top_right',
    gap_x = 40,
    gap_y = 44,
    minimum_width = 430, maximum_width = 430,
    minimum_height = 260,

    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    double_buffer = true,
    update_interval = 30.0,
    draw_shades = false,
    draw_outline = false,

    default_color = 'EDEDED',
    color1 = '8A8A8A',
    color2 = '4A4A4A',
    color3 = 'D71921',

    use_xft = true,
    xftalpha = 1,
    override_utf8_locale = true,
    font = 'Lettera Mono LL:size=10',
}

conky.text = [[
${execpi 30 /home/arjun/.config/conky/nothing/repos-panel.sh}
]]
